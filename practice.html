<script type="application/json" id="academy-data">{"v":1,"engine":"1.0.0","build":{"at":"2026-11-25T09:03:20Z","version":"2027.1.0","commit":"9b66171"},"course":{"id":"fnd-mth-105","code":"FND-MTH-105","title":"Discrete Mathematics and Logic for Computing","track":"foundations","lang":"en","dir":"ltr","url":"https://sdaiaacademy.github.io/fnd-mth-105/","repo":"SDAIAAcademy/fnd-mth-105","home":"index.html","outcomes":[{"id":"LO1","text":"Identify whether a relation is a function, an equivalence or an order, and which properties it has, given twelve relations from data and software"},{"id":"LO2","text":"Distinguish valid from invalid arguments and translate plain-language rules into propositional and predicate logic, given five access and data-quality rules"},{"id":"LO3","text":"Describe direct, contradiction and induction proofs and identify the gap in a flawed proof, given six short proofs, two with planted errors"},{"id":"LO4","text":"Apply induction and loop invariants to prove simple claims about integers, sets and recursive code, given claims first tested in code"},{"id":"LO5","text":"Compute counts of arrangements, selections and collisions and verify them by enumeration, given hashing and record-linkage problems"},{"id":"LO6","text":"Use a graph model of dependencies to find cycles and compute a topological order, given a pipeline graph with a planted cycle"}],"unit":"week","units":[{"n":1,"id":"week1","label":"Week 1","title":"Sets, functions and relations","sessions":[{"n":1,"label":"Session 1","title":"Sets, functions and relations"}]},{"n":2,"id":"week2","label":"Week 2","title":"Logic: truth tables and satisfiability","sessions":[{"n":1,"label":"Session 1","title":"Propositional logic, normal forms and SAT"}]},{"n":3,"id":"week3","label":"Week 3","title":"Predicates, quantifiers and first proofs","sessions":[{"n":1,"label":"Session 1","title":"Quantifiers, relations and first proofs"}]},{"n":4,"id":"week4","label":"Week 4","title":"Induction, invariants and the limits of testing","sessions":[{"n":1,"label":"Session 1","title":"Induction, invariants, testing and proof"}]},{"n":5,"id":"week5","label":"Week 5","title":"Counting, collisions and the birthday problem","sessions":[{"n":1,"label":"Session 1","title":"Counting arrangements and collisions"}]},{"n":6,"id":"week6","label":"Week 6","title":"Counting people: re-identification risk","sessions":[{"n":1,"label":"Session 1","title":"Inclusion-exclusion and linkage risk"}]},{"n":7,"id":"week7","label":"Week 7","title":"Graphs, topological order and growth","sessions":[{"n":1,"label":"Session 1","title":"Graphs, cycles, orders and recurrences"}]},{"n":8,"id":"capstone","label":"Capstone","title":"Portfolio oral defences","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-sets-q1","type":"single","prompt":"A training team lists 8 modules and 5 rooms. It wants one row for every module and room that could be booked together. How many rows does that table have?","options":[{"key":"A","text":"13"},{"key":"B","text":"40"},{"key":"C","text":"2 to the power 40"},{"key":"D","text":"80"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The table is the product of the two sets: 8 · 5 = 40 pairs.","misconceptions":["Adds the sizes: that counts modules or rooms, not pairs of them","","Counts the relations, the subsets of the product, not the pairs in it","Thinks a module and a room in either order make two rows: a pair from A × B has a fixed order"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"week1","id":"check-sets","title":"How many pairs?"},"level":null,"pool":"checkpoint"},{"id":"check-functions-q1","type":"single","prompt":"A sports hall gives each of its 120 lockers to one of 4 cleaning rounds, every round gets 30 lockers. As a map from lockers to rounds, which is true?","options":[{"key":"A","text":"A bijection, since every round gets the same number"},{"key":"B","text":"Not a function, since each round has many lockers"},{"key":"C","text":"Injective, since every round is used"},{"key":"D","text":"A surjective function that is not injective"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Each locker has exactly one round (a function), every round is reached (surjective), and 30 lockers share each round (not injective).","misconceptions":["Thinks equal shares make a bijection: 120 lockers cannot pair one to one with 4 rounds","Reads 'many lockers per round' as 'many rounds per locker': each locker still has one round","Confuses injective with surjective: it is the reaching of every round that holds",""],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"week1","id":"check-functions","title":"What kind of map is this?"},"level":null,"pool":"checkpoint"},{"id":"check-composition-q1","type":"single","prompt":"A library joins loans (reader, copy) with copies (copy, title). One reader borrowed two copies of the same title. Compared with the composition \"reader borrowed title\", the join returns:","options":[{"key":"A","text":"the same number of rows as there are pairs"},{"key":"B","text":"one fewer row, as the second copy is dropped"},{"key":"C","text":"one more row: the (reader, title) pair appears twice"},{"key":"D","text":"an error, as the key repeats"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Each loan row matches one copy row, so two loans give two rows with the same (reader, title); the composition keeps that pair once.","misconceptions":["Assumes a join removes duplicates like a set: SQL keeps one row per matching pair","Thinks the repeated title is dropped: the join keeps both matching rows","","Thinks a repeat breaks the join: the join runs, it just repeats a row"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"week1","id":"check-composition","title":"Join rows or composition pairs?"},"level":null,"pool":"checkpoint"},{"id":"review-week1-q1","type":"single","prompt":"A school replaces each of its 500 pupil numbers with a random code from 1,000 possible codes, never giving one code twice. As a map from pupils to the 1,000 codes, what is it?","options":[{"key":"A","text":"A bijection"},{"key":"B","text":"Injective, not surjective"},{"key":"C","text":"Surjective, not injective"},{"key":"D","text":"Not a function"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"No two pupils share a code (injective), but half the codes are never used (not surjective). On its 500 pupils and the codes used, it can still be inverted.","misconceptions":["Thinks 'no repeats' is enough for a bijection: 500 unused codes mean it is not surjective","","Confuses the two properties: it is the absence of shared codes that holds here","Thinks a random choice is not a function: each pupil still gets exactly one code"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"week2","id":"review-week1","title":"Can the code be swapped back?"},"level":null,"pool":"checkpoint"},{"id":"check-converse-q1","type":"single","prompt":"A warehouse rule: \"If a box is fragile, it is packed with foam.\" Which sentence is equivalent to it?","options":[{"key":"A","text":"If a box is packed with foam, it is fragile"},{"key":"B","text":"If a box is not fragile, it is not packed with foam"},{"key":"C","text":"Every box is fragile and packed with foam"},{"key":"D","text":"If a box is not packed with foam, it is not fragile"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The contrapositive ¬q → ¬p agrees with p → q on all four rows.","misconceptions":["Takes the converse for the rule: foam on a sturdy box does not break it","Takes the inverse for the rule: the rule says nothing about sturdy boxes","Turns the condition into a conjunction: that forces every box to be fragile",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"week2","id":"check-converse","title":"Which sentence says the same thing?"},"level":null,"pool":"checkpoint"},{"id":"check-only-if-q1","type":"single","prompt":"A laboratory: \"A visitor may enter only if they wear goggles.\" With p = \"the visitor enters\" and s = \"the visitor wears goggles\", which formula is the rule?","options":[{"key":"A","text":"s → p"},{"key":"B","text":"p → s"},{"key":"C","text":"p ∧ s"},{"key":"D","text":"p ↔ s"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"\"p only if q\" is p → q: entering requires goggles, and goggles require nothing.","misconceptions":["Reads 'only if' as 'if': that makes goggles a promise of entry","","Turns a condition into a fact: every visitor would have to enter","Makes the condition two-way: wearing goggles would oblige the visitor to enter"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"week2","id":"check-only-if","title":"Translate the rule"},"level":null,"pool":"checkpoint"},{"id":"check-unsat-q1","type":"single","prompt":"A clinic encodes its nurse rota and the solver answers \"unsatisfiable\". What has been established?","options":[{"key":"A","text":"The solver failed and should be run again with more time"},{"key":"B","text":"No rota was found among those the solver tried"},{"key":"C","text":"No rota meets all the clauses as written"},{"key":"D","text":"No rota meets the clinic's real rules"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The answer covers every assignment of the encoded clauses. Whether the clauses say what the clinic meant is a separate check.","misconceptions":["Blames the tool: an unsatisfiable answer is a proof about the clauses, not a crash","Thinks the solver tried only some rotas: it rules out every assignment","","Forgets the encoding can be wrong: the rules meant may differ from the clauses written"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"week2","id":"check-unsat","title":"What does \"unsatisfiable\" tell the planner?"},"level":null,"pool":"checkpoint"},{"id":"review-week2-q1","type":"single","prompt":"Rule: if a meter reading is missing, the bill is estimated. This bill is not estimated. What follows?","options":[{"key":"A","text":"The reading is not missing"},{"key":"B","text":"The reading is missing"},{"key":"C","text":"Nothing: the rule says nothing about estimated bills"},{"key":"D","text":"The bill would be estimated if the reading were present"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Modus tollens: from p → q and ¬q, conclude ¬p. No row has both premises true and \"missing\" true.","misconceptions":["","Reads the rule backwards: a missing reading forces an estimate, so it cannot go with an exact bill","Thinks nothing follows from a negated conclusion: modus tollens is valid","Reverses the arrow: a missing reading forces an estimate, not the other way"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"week3","id":"review-week2","title":"Valid or not?"},"level":null,"pool":"checkpoint"},{"id":"check-negation-q1","type":"single","prompt":"The claim: \"every course has at least one tutor\". Which statement is its negation?","options":[{"key":"A","text":"Every course has no tutor"},{"key":"B","text":"Some course has at least one tutor"},{"key":"C","text":"Some course has no tutor"},{"key":"D","text":"One tutor teaches no course"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"¬∀c ∃t T(c, t) is ∃c ∀t ¬T(c, t): one course without any tutor is enough to make the claim false.","misconceptions":["Negates only the inner part: it keeps 'every' where 'some' belongs","Negates the outer quantifier only: 'some course has a tutor' is consistent with the claim","","Swaps the order of the quantifiers instead of negating them"],"lo":["LO2"],"day":3,"session":1,"slide":{"deck":"week3","id":"check-negation","title":"What is the negation?"},"level":null,"pool":"checkpoint"},{"id":"check-classify-q1","type":"single","prompt":"A delivery firm relates two depots when they are within 5 km of each other, and wants to form groups of \"nearby\" depots with it. What is this relation?","options":[{"key":"A","text":"An equivalence relation, so the groups are well defined"},{"key":"B","text":"Reflexive and symmetric, not transitive, so not an equivalence"},{"key":"C","text":"A partial order on the depots"},{"key":"D","text":"Symmetric only, as no depot relates to itself"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A is 4 km from B and B 4 km from C, but A can be 8 km from C. Without transitivity the \"groups\" overlap and depend on where you start.","misconceptions":["Assumes nearness chains: A near B and B near C can be 9 km apart","","Treats nearness as a ranking: it relates pairs both ways, so it cannot be antisymmetric","Forgets that each depot is 0 km from itself"],"lo":["LO1"],"day":3,"session":1,"slide":{"deck":"week3","id":"check-classify","title":"Can it be used to form groups?"},"level":null,"pool":"checkpoint"},{"id":"check-method-q1","type":"single","prompt":"An analyst claims: \"for every integer n, n² + n is even\". Her code checks n from −1,000 to 1,000 and finds no failure. What has she shown?","options":[{"key":"A","text":"That the claim is true, since 2,001 cases passed"},{"key":"B","text":"Nothing: tests are no evidence either way"},{"key":"C","text":"That the claim is false for some large n"},{"key":"D","text":"No counterexample in that range; a proof is still needed"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The test is evidence and finds no counterexample. The proof: n² + n = n(n + 1), a product of two consecutive integers, one of them even.","misconceptions":["Treats many passing cases as a proof: the integers beyond 1,000 were never checked","Thinks a test result says nothing at all: it rules out a counterexample in that range","Confuses a passing test with a refutation",""],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"week3","id":"check-method","title":"What settles the claim?"},"level":null,"pool":"checkpoint"},{"id":"review-week3-q1","type":"single","prompt":"On the files of a shared drive, \"file A is in the same folder as file B or in one of its subfolders\" relates A to B. Which property does it lack?","options":[{"key":"A","text":"Reflexivity"},{"key":"B","text":"Transitivity"},{"key":"C","text":"It has all four, so it is an equivalence"},{"key":"D","text":"Symmetry"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A file in a subfolder relates to a file in the parent folder, but not the other way round.","misconceptions":["Misses that every file is in its own folder, so each relates to itself","Misses that nesting chains: a subfolder of a subfolder is still a subfolder","Thinks the property holds by name only: a file deep inside relates to one above, not back",""],"lo":["LO1"],"day":4,"session":null,"slide":{"deck":"week4","id":"review-week3","title":"Which property fails?"},"level":null,"pool":"checkpoint"},{"id":"check-induction-parts-q1","type":"single","prompt":"A proof that \"n + 1 \u003c n for every n ≥ 1\" assumes k + 1 \u003c k and adds 1 to both sides to get k + 2 \u003c k + 1. What is wrong with it?","options":[{"key":"A","text":"It has no base case, and the base case is false"},{"key":"B","text":"Adding 1 to both sides is not allowed"},{"key":"C","text":"The hypothesis assumes what it wants to prove"},{"key":"D","text":"It needs strong induction instead"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The step is valid on its own; with no true starting case it proves nothing. For n = 1, 2 \u003c 1 is false.","misconceptions":["","Blames the algebra: adding 1 to both sides of an inequality is valid","Thinks the hypothesis is the flaw: assuming P(k) is how every induction step works","Thinks strong induction would rescue it: no form of induction proves a false claim"],"lo":["LO3"],"day":4,"session":1,"slide":{"deck":"week4","id":"check-induction-parts","title":"What is missing?"},"level":null,"pool":"checkpoint"},{"id":"check-structural-q1","type":"single","prompt":"To prove by structural induction that a recursive depth function on nested lists is correct, the step for a list [a, b, c] may assume:","options":[{"key":"A","text":"that the function is correct on [a, b, c]"},{"key":"B","text":"that it is correct on a only"},{"key":"C","text":"that it is correct on each of a, b and c"},{"key":"D","text":"that it is correct on every list of length 2"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The hypothesis is the claim for every immediate part of the structure; the step builds the whole from them.","misconceptions":["Assumes the claim for the whole structure, which is what the step must show","Thinks only one part may be assumed: the hypothesis covers every smaller part","","Thinks structural induction needs a numeric n: it inducts on the structure"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"week4","id":"check-structural","title":"What may the step assume?"},"level":null,"pool":"checkpoint"},{"id":"check-invariant-q1","type":"single","prompt":"A loop counts the even numbers in a list: count starts at 0, i at 0; each pass adds 1 to count if xs[i] is even, then adds 1 to i. Which invariant proves it correct?","options":[{"key":"A","text":"count ≥ 0"},{"key":"B","text":"count equals the number of evens in the whole list"},{"key":"C","text":"count = i"},{"key":"D","text":"count equals the number of evens in xs[:i]"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"It holds at the start (0 evens in an empty prefix), each pass keeps it, and at exit i = len(xs) gives the result.","misconceptions":["Picks a true but weak statement: it holds and proves nothing about the result","Describes the final result, which is false before the loop has finished","Ties count to i, which only holds when every element so far was even",""],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"week4","id":"check-invariant","title":"Which statement is an invariant?"},"level":null,"pool":"checkpoint"},{"id":"review-week4-q1","type":"single","prompt":"To prove 1 + 3 + 9 + … + 3ⁿ⁻¹ = (3ⁿ − 1) / 2 by induction, the step for k + 1 must:","options":[{"key":"A","text":"check the formula for n = k + 1 by computing both sides for k = 5"},{"key":"B","text":"assume the formula for k + 1 and simplify"},{"key":"C","text":"replace the first k terms by (3ᵏ − 1) / 2, add 3ᵏ, and simplify to (3ᵏ⁺¹ − 1) / 2"},{"key":"D","text":"test the formula for n up to 1,000"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"(3ᵏ − 1) / 2 + 3ᵏ = (3 · 3ᵏ − 1) / 2: the hypothesis supplies the first k terms.","misconceptions":["Checks a single case again: the base case does that, the step must reach every next case","Assumes the result for k + 1, which is what the step must show","","Replaces the proof with a test: many cases are evidence, not a proof"],"lo":["LO4"],"day":5,"session":null,"slide":{"deck":"week5","id":"review-week4","title":"Where is the hypothesis used?"},"level":null,"pool":"checkpoint"},{"id":"check-counting-q1","type":"single","prompt":"A tasting panel of 4 judges is chosen from 9 cooks; the judges have no roles. How many panels are possible?","options":[{"key":"A","text":"3,024"},{"key":"B","text":"126"},{"key":"C","text":"6,561"},{"key":"D","text":"36"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"C(9, 4) = 9 · 8 · 7 · 6 / 4! = 3,024 / 24 = 126.","misconceptions":["Counts ordered choices: the panel has no roles, so order must not count","","Counts every sequence with repeats: a cook cannot sit twice","Chooses 2 judges instead of 4: that is C(9, 2)"],"lo":["LO5"],"day":5,"session":1,"slide":{"deck":"week5","id":"check-counting","title":"Arrangement or selection?"},"level":null,"pool":"checkpoint"},{"id":"check-collision-q1","type":"single","prompt":"A shop gives each of 50 loyalty cards a random 3-digit code (1,000 codes). On average over all assignments, how many pairs of cards share a code?","options":[{"key":"A","text":"0.05"},{"key":"B","text":"2.45"},{"key":"C","text":"50"},{"key":"D","text":"1.225"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"C(50, 2) / 1,000 = 1,225 / 1,000 = 1.225 pairs on average.","misconceptions":["Divides people by codes: that is a load, not a count of pairs","Counts ordered pairs: each pair is counted twice","Treats any collision as certain beyond a threshold: it is an average, not a guarantee",""],"lo":["LO5"],"day":5,"session":1,"slide":{"deck":"week5","id":"check-collision","title":"How many colliding pairs to expect?"},"level":null,"pool":"checkpoint"},{"id":"check-pigeonhole-q1","type":"single","prompt":"A depot sorts 830 parcels into 100 bays by the last two digits of the parcel number. What does the pigeonhole principle guarantee?","options":[{"key":"A","text":"Some bay receives at least 9 parcels"},{"key":"B","text":"Every bay receives 8 or 9 parcels"},{"key":"C","text":"Some bay receives at least 8 parcels, and no more is guaranteed"},{"key":"D","text":"Nothing, since 830 is less than 100 · 100"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"⌈830 / 100⌉ = 9: if every bay held at most 8, the bays would hold at most 800 parcels.","misconceptions":["","Assumes an even spread: the principle only bounds the fullest bay from below","Rounds down instead of up: 100 bays of 8 hold only 800 parcels","Thinks collisions need more parcels than bays squared"],"lo":["LO5"],"day":5,"session":1,"slide":{"deck":"week5","id":"check-pigeonhole","title":"What is guaranteed?"},"level":null,"pool":"checkpoint"},{"id":"review-week5-q1","type":"single","prompt":"Five interns each draw one of 8 desk numbers. In how many of the 8⁵ draws do all five get different desks?","options":[{"key":"A","text":"56"},{"key":"B","text":"32,768"},{"key":"C","text":"6,720"},{"key":"D","text":"40,320"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"P(8, 5) = 8 · 7 · 6 · 5 · 4 = 6,720.","misconceptions":["Counts unordered sets of desks: the interns are distinct, so order matters","Counts every draw, repeats included","","Multiplies too many factors: five interns take five desks, not eight"],"lo":["LO5"],"day":6,"session":null,"slide":{"deck":"week6","id":"review-week5","title":"How many all-different assignments?"},"level":null,"pool":"checkpoint"},{"id":"check-ie-q1","type":"single","prompt":"Of a club's members, 45 read the newsletter, 30 attend events and 12 do both. How many do at least one of the two?","options":[{"key":"A","text":"75"},{"key":"B","text":"63"},{"key":"C","text":"51"},{"key":"D","text":"33"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"45 + 30 − 12 = 63: the 12 who do both were counted in both sets.","misconceptions":["Adds the sets and forgets the overlap, counting the 12 twice","","Subtracts the overlap twice","Counts only the readers who do not attend"],"lo":["LO5"],"day":6,"session":1,"slide":{"deck":"week6","id":"check-ie","title":"How many are in at least one?"},"level":null,"pool":"checkpoint"},{"id":"check-unique-q1","type":"single","prompt":"A survey of 500 people keeps age in years (60 values), sex and one of 4 regions. Roughly how many combinations are there per person?","options":[{"key":"A","text":"240,000"},{"key":"B","text":"66"},{"key":"C","text":"about 0.48"},{"key":"D","text":"about 0.96"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"60 · 2 · 4 = 480 combinations for 500 people: about one each, so many people will be alone or nearly so.","misconceptions":["Multiplies people by combinations instead of dividing","Adds the column sizes instead of multiplying them","Forgets sex in the product: 60 · 4 = 240",""],"lo":["LO5"],"day":6,"session":1,"slide":{"deck":"week6","id":"check-unique","title":"What does the product rule predict?"},"level":null,"pool":"checkpoint"},{"id":"check-anonymised-q1","type":"single","prompt":"A gym removes member numbers from its list and keeps full birth date, sex and home district. Most members are alone in their combination. Under the Law's definition, the list is:","options":[{"key":"A","text":"anonymised, since no identifier remains"},{"key":"B","text":"still personal data, since it makes identification indirectly possible"},{"key":"C","text":"pseudonymised, so outside the Law"},{"key":"D","text":"personal data only if more than half are unique"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The definition covers data that may indirectly make identification possible, which unique combinations do.","misconceptions":["Thinks anonymity comes from removing the identifier column: other columns still single people out","","Confuses pseudonymised data, where a code replaces the identifier, with this list","Thinks a law turns on a fixed share of unique people: the definition speaks of possibility"],"lo":["LO5"],"day":6,"session":1,"slide":{"deck":"week6","id":"check-anonymised","title":"Is it anonymised?"},"level":null,"pool":"checkpoint"},{"id":"review-week6-q1","type":"single","prompt":"Two tables are released. 32 people are alone in their combination in the first, 18 in the second, and 7 of them are alone in both. How many people are alone in at least one table?","options":[{"key":"A","text":"43"},{"key":"B","text":"50"},{"key":"C","text":"32"},{"key":"D","text":"36"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"32 + 18 − 7 = 43: the risk of two releases is the union of the people they expose.","misconceptions":["","Adds the two counts and counts the 7 in both twice","Takes the riskier table alone: releases combine","Subtracts the overlap twice"],"lo":["LO5"],"day":7,"session":null,"slide":{"deck":"week7","id":"review-week6","title":"How many people can be found?"},"level":null,"pool":"checkpoint"},{"id":"check-cycle-q1","type":"single","prompt":"Edges: A → B, B → C, C → D, D → B, A → E. Peeling starts with every job that has no dependency. Which jobs are never ready?","options":[{"key":"A","text":"B, C and D"},{"key":"B","text":"D only"},{"key":"C","text":"B, C, D and E"},{"key":"D","text":"none, since A has no dependency"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A runs, then E. B waits on D, D on C, C on B: none of the three ever becomes ready.","misconceptions":["","Blames only the edge that closes the cycle: B and C wait on it too","Thinks everything after A waits: E depends only on A, which finishes","Thinks one source is enough for the run to finish"],"lo":["LO6"],"day":7,"session":1,"slide":{"deck":"week7","id":"check-cycle","title":"Which jobs are never ready?"},"level":null,"pool":"checkpoint"},{"id":"check-topo-q1","type":"single","prompt":"Edges: P → R, Q → R, R → S, Q → S. Which running order respects every edge?","options":[{"key":"A","text":"P R Q S"},{"key":"B","text":"Q P S R"},{"key":"C","text":"Q P R S"},{"key":"D","text":"R Q P S"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Check each edge: P before R, Q before R, R before S, Q before S all hold in Q P R S.","misconceptions":["Puts R before Q, breaking Q → R","Puts S before R, breaking R → S","","Starts with the job that has the most edges: R needs P and Q first"],"lo":["LO6"],"day":7,"session":1,"slide":{"deck":"week7","id":"check-topo","title":"Which order is valid?"},"level":null,"pool":"checkpoint"},{"id":"check-recurrence-q1","type":"single","prompt":"H(1) = 0 and H(n) = H(n − 1) + (n − 1). What is H(6)?","options":[{"key":"A","text":"21"},{"key":"B","text":"30"},{"key":"C","text":"36"},{"key":"D","text":"15"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"0, 1, 3, 6, 10, 15: or 6 · 5/2 = 15 from the closed form.","misconceptions":["Adds n instead of n − 1 at each step: that is n(n + 1)/2","Forgets to halve: n(n − 1) counts each link twice","Uses n², the growth of the count, not its value",""],"lo":["LO4"],"day":7,"session":1,"slide":{"deck":"week7","id":"check-recurrence","title":"What does the recurrence give?"},"level":null,"pool":"checkpoint"},{"id":"w1-product-size","type":"single","prompt":"A clinic lists 6 doctors and 4 consulting rooms. A rota table has one row for every possible doctor and room pair. How many rows does it have?","options":[{"key":"A","text":"24"},{"key":"B","text":"10"},{"key":"C","text":"2 to the power 24"},{"key":"D","text":"4 to the power 6"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The rows are the Cartesian product of the two sets, so there are 6 times 4 = 24 of them.","misconceptions":["","Adds the two sizes: that counts doctors or rooms, not pairs","Counts the relations, every subset of the pairs, not the pairs","Counts the functions from doctors to rooms, not the pairs"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w1-not-a-function","type":"single","prompt":"A staff table maps each employee code to a desk. Two codes have no desk and one code has two desks. Which statement is right?","options":[{"key":"A","text":"It is an injective function"},{"key":"B","text":"It is a function, only not surjective"},{"key":"C","text":"It is a bijection once the duplicates are removed"},{"key":"D","text":"It is not a function on the employee codes"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A function needs exactly one output for every input: a missing desk and a second desk each break that.","misconceptions":["Thinks injectivity is about inputs having outputs: it is about outputs not being shared","Misses that a missing or second output breaks the function itself","Believes removing rows fixes totality: the two codes without a desk still have no output",""],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w1-injective-integers","type":"single","prompt":"Which map from the integers to the integers is injective but not surjective?","options":[{"key":"A","text":"n to n squared"},{"key":"B","text":"n to n minus 4"},{"key":"C","text":"n to 5n"},{"key":"D","text":"n to the remainder of n divided by 2"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"5m = 5n gives m = n, so it is injective; 7 is never reached, so it is not surjective.","misconceptions":["Misses that n and minus n share a square, so it is not injective","Misses that every integer m is reached by m plus 4: it is a bijection","","Misses that infinitely many integers share each remainder"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w1-join-rows","type":"single","prompt":"A warehouse joins orders (customer, order) with order lines (order, product). Is the join the composition 'customer ordered product'?","options":[{"key":"A","text":"Yes, row for row"},{"key":"B","text":"Its distinct rows are; the join can repeat a pair"},{"key":"C","text":"No, a join is never related to composition"},{"key":"D","text":"Only when every order has exactly one line in the table, never otherwise"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The join has one row per matching pair of rows; removing repeated rows leaves the composition, a set of pairs.","misconceptions":["Forgets that a customer can order one product in two orders, which repeats the pair","","Misses that the join's distinct rows are exactly the composition","Thinks one line per order prevents repeats: two orders of one product by one customer still repeat"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w2-affirming","type":"single","prompt":"Rule: if a request is urgent, the duty officer is paged. The duty officer was paged. A colleague concludes the request was urgent. Is the argument valid?","options":[{"key":"A","text":"Valid, by modus ponens"},{"key":"B","text":"Invalid: a non-urgent request may also page the officer"},{"key":"C","text":"Valid, by modus tollens, since the officer was paged and the rule holds"},{"key":"D","text":"Invalid, because the rule itself may be false"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The row with urgent false and paged true makes both premises true and the conclusion false, so the form is invalid.","misconceptions":["Mistakes the form: modus ponens starts from 'urgent', not from 'paged'","","Mistakes the form: modus tollens starts from 'not paged'","Confuses validity with truth: validity is about the form, whatever the premises' truth"],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w2-unless","type":"single","prompt":"'The gate stays locked unless a guard is present.' With l = locked and g = guard present, which formula is equivalent?","options":[{"key":"A","text":"l ∨ g"},{"key":"B","text":"g → l"},{"key":"C","text":"l ∧ ¬g"},{"key":"D","text":"l ↔ g"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"'p unless q' is ¬q → p, which is equivalent to p ∨ q: when no guard is present, the gate is locked.","misconceptions":["","Reverses the condition: a guard being present does not force the gate locked","Makes it a fact that no guard is ever present","Makes it two-way: the rule does not say a guard locks the gate"],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w2-cnf-clauses","type":"single","prompt":"Six tasks are yes-or-no variables. Encoding 'at most one task runs' by forbidding every pair, how many clauses are needed?","options":[{"key":"A","text":"6"},{"key":"B","text":"12"},{"key":"C","text":"36"},{"key":"D","text":"15"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"One clause per pair of tasks: 6 · 5 / 2 = 15.","misconceptions":["Counts one clause per task: that encodes 'at least one' style rules, not every pair","Counts ordered pairs once each way without halving correctly","Counts every ordered pair including a task with itself",""],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w2-equivalent","type":"single","prompt":"Which pair of formulas is equivalent on every row of the truth table?","options":[{"key":"A","text":"p → q and q → p"},{"key":"B","text":"¬(p ∨ q) and ¬p ∨ ¬q"},{"key":"C","text":"p → q and ¬p ∨ q"},{"key":"D","text":"p ∧ (q ∨ r) and (p ∧ q) ∨ r"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"p → q is false only when p is true and q false, exactly when ¬p ∨ q is false.","misconceptions":["Takes the converse for an equivalent: they differ when p is false and q true","Misapplies De Morgan: the negation of an or is the and of the negations","","Distributes only half way: with r true and p false the two differ"],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w2-sat-check","type":"single","prompt":"A solver returns a shift plan for a clinic. What should the planner do before using it?","options":[{"key":"A","text":"Nothing: a solver's model always meets the rules"},{"key":"B","text":"Run the solver a second time and compare the two plans it returns, line by line"},{"key":"C","text":"Check the plan against the rules in words with separate code"},{"key":"D","text":"Count the clauses to confirm the encoding is complete"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The model meets the clauses written; only an independent check against the rules catches an encoding mistake.","misconceptions":["Forgets that a wrong clause produces a wrong plan that still satisfies the clauses","Thinks agreement between two runs shows correctness: both satisfy the same wrong clauses","","Treats the number of clauses as evidence of their meaning"],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w3-preorder","type":"single","prompt":"In a sports league, team A relates to team B when A has at least as many points as B. Two teams are level on points. Which kind of relation is it?","options":[{"key":"A","text":"An equivalence relation"},{"key":"B","text":"A preorder that is not a partial order"},{"key":"C","text":"A partial order, since the relation is reflexive and transitive"},{"key":"D","text":"A strict order"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"It is reflexive and transitive, but two different level teams relate both ways, so it is not antisymmetric.","misconceptions":["Takes 'relates both ways for level teams' as symmetry: a leader does not relate back to a team below","","Misses that two different level teams break antisymmetry","Misses that every team has at least as many points as itself, so the relation is reflexive"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w3-transitive-test","type":"single","prompt":"Which relation on the people of a town is NOT transitive?","options":[{"key":"A","text":"Lives within 2 km of"},{"key":"B","text":"Is older than"},{"key":"C","text":"Was born in the same year as"},{"key":"D","text":"Has the same surname initial as"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A within 2 km of B and B within 2 km of C allows A and C to be up to 4 km apart.","misconceptions":["","Misses that 'older than' chains: older than someone older is older still","Misses that 'same year' is an equivalence: it is transitive","Misses that 'same initial' is an equivalence: it is transitive"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w3-negation","type":"single","prompt":"Rule: 'every invoice has an approver'. Which finding shows the rule is broken?","options":[{"key":"A","text":"One invoice has two approvers"},{"key":"B","text":"Every invoice has no approver"},{"key":"C","text":"One approver has no invoice"},{"key":"D","text":"One invoice has no approver"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The negation of 'for every invoice, some approver' is 'some invoice has no approver': one witness suffices.","misconceptions":["Confuses 'at least one' with 'exactly one'","States a much stronger claim than the negation needs","Reverses the quantified variable: the rule is about invoices",""],"lo":["LO2"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w3-counterexample","type":"single","prompt":"A colleague claims: 'for every positive integer n, 2n + 1 is prime'. Which is the best response?","options":[{"key":"A","text":"Test n from 1 to 3: all prime, so accept"},{"key":"B","text":"Reject it, because claims about all integers cannot be checked"},{"key":"C","text":"Ask for a proof by induction before deciding"},{"key":"D","text":"Give n = 4: 2n + 1 = 9 = 3 · 3"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"One counterexample refutes a 'for every' claim.","misconceptions":["Treats a few passing tests as a proof","Thinks universal claims cannot be settled: one counterexample refutes them","Asks for a proof of a false claim: a counterexample settles it at once",""],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w3-contradiction","type":"single","prompt":"To prove 'if n² is odd then n is odd' by contradiction, what do you assume first?","options":[{"key":"A","text":"n² is odd and n is odd"},{"key":"B","text":"n² is even and n is even"},{"key":"C","text":"n² is odd and n is even"},{"key":"D","text":"n is odd"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A proof by contradiction assumes the hypothesis and the negation of the conclusion, then derives something impossible.","misconceptions":["Assumes the claim itself, which proves nothing","Assumes the negation of both parts, which is the converse's contrapositive","","Assumes only the conclusion, which is the claim to be shown"],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w4-hypothesis-use","type":"single","prompt":"In an induction proof that 3 divides n³ − n for every n ≥ 1, where must the hypothesis be used?","options":[{"key":"A","text":"In the base case, to check n = 1"},{"key":"B","text":"In the step, to rewrite the part of (k + 1)³ − (k + 1) that equals k³ − k"},{"key":"C","text":"At the end, to conclude the claim for all n"},{"key":"D","text":"Nowhere: the step is pure algebra on (k + 1)³ − (k + 1), expanded and regrouped term by term"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"(k + 1)³ − (k + 1) = (k³ − k) + 3k² + 3k; the hypothesis says 3 divides k³ − k, and 3 divides the rest.","misconceptions":["Confuses the base case with the step: the base is checked directly","","Thinks the conclusion uses the hypothesis: it follows from base and step together","Misses that divisibility of k³ − k is exactly what the algebra cannot supply"],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w4-tested-claim","type":"single","prompt":"A claim about every positive integer passes all tests for n up to 10,000. What may the report say?","options":[{"key":"A","text":"No counterexample for n from 1 to 10,000; not yet proved"},{"key":"B","text":"The claim is true for all practical purposes"},{"key":"C","text":"The claim is true"},{"key":"D","text":"The claim is false beyond 10,000"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Tests show the absence of a counterexample in the range tried; only a proof covers every n.","misconceptions":["","Softens the same error: 'practical purposes' still claims more than was checked","Treats tests as proof: patterns can break after many passes","Turns absence of evidence into a refutation"],"lo":["LO3"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w4-invariant-parts","type":"single","prompt":"An analyst shows that an invariant holds before a loop and after every pass. What else does the correctness proof need?","options":[{"key":"A","text":"That the loop terminates, and that the invariant with the exit condition gives the result"},{"key":"B","text":"Nothing more"},{"key":"C","text":"A test on random inputs"},{"key":"D","text":"That the invariant also holds in the middle of every pass, between any two statements of the loop body"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Initialisation and maintenance give an invariant; termination and the exit condition turn it into the result.","misconceptions":["","Forgets termination and the link to the result","Treats a test as a substitute for the missing proof steps","Asks for more than an invariant promises: it may be broken inside a pass"],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w4-flawed-step","type":"single","prompt":"A proof that '2ⁿ ≥ n³ for every n ≥ 1' checks n = 1 and has a step that uses 2k³ ≥ (k + 1)³ without saying so. Testing shows 2² = 4 \u003c 8 = 2³. Where is the gap?","options":[{"key":"A","text":"In the base case"},{"key":"B","text":"Nowhere: a written proof outweighs a failing test, so the test must be wrong"},{"key":"C","text":"In the identity 2ᵏ⁺¹ = 2 · 2ᵏ"},{"key":"D","text":"In the step, which is not valid for small k"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"2k³ ≥ (k + 1)³ holds only from k = 4 on, so the step from n = 1 to n = 2 is not justified.","misconceptions":["Blames the base case, which was checked and is true","Trusts the argument over a concrete counterexample, which settles the claim","Blames a correct identity",""],"lo":["LO3"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w4-structural","type":"single","prompt":"A recursive function counts the files in a folder tree by adding the counts of its subfolders. A proof of its correctness by structural induction assumes:","options":[{"key":"A","text":"the function is correct on the whole tree"},{"key":"B","text":"the tree has at most two levels"},{"key":"C","text":"the function is correct on every subfolder of the folder"},{"key":"D","text":"every folder has the same number of files"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The hypothesis is the claim for every immediate part; the step shows it for the folder built from them.","misconceptions":["Assumes the conclusion","Restricts the structure for no reason: the induction covers any depth","","Adds a condition the proof does not need"],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w5-product","type":"single","prompt":"A ticket code is one letter from A to J followed by three digits. How many codes are there?","options":[{"key":"A","text":"13"},{"key":"B","text":"10,000"},{"key":"C","text":"1,000"},{"key":"D","text":"40"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Product rule: 10 letters times 10 · 10 · 10 digits = 10,000.","misconceptions":["Adds the choices instead of multiplying them","","Forgets the letter","Multiplies the number of positions by the letters"],"lo":["LO5"],"day":5,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w5-arrangement","type":"single","prompt":"From 7 drivers, a dispatcher picks a first, a second and a third driver for a route, in that order. How many choices are there?","options":[{"key":"A","text":"35"},{"key":"B","text":"210"},{"key":"C","text":"343"},{"key":"D","text":"21"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Order matters and no driver repeats: P(7, 3) = 7 · 6 · 5 = 210.","misconceptions":["Counts unordered selections, C(7, 3)","","Allows a driver to be picked more than once: 7³","Counts pairs, C(7, 2)"],"lo":["LO5"],"day":5,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w5-collision-formula","type":"single","prompt":"Four guests each get one of 10 table numbers at random. Counting assignments, what is the chance that all four numbers differ?","options":[{"key":"A","text":"10 · 9 · 8 · 7 / 10⁴"},{"key":"B","text":"4 / 10"},{"key":"C","text":"1 − 4/10"},{"key":"D","text":"C(10, 4) / 10⁴"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"There are 10⁴ assignments, of which P(10, 4) = 10 · 9 · 8 · 7 have no repeat.","misconceptions":["","Treats the chance as guests over tables","Subtracts a load from one","Counts unordered sets of tables, but the assignments are ordered by guest"],"lo":["LO5"],"day":5,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w5-brute","type":"single","prompt":"An analyst's formula for collision-free assignments gives 60 for 5 codes and 3 people. Listing all 125 assignments finds 60 with no repeat. What does the agreement show?","options":[{"key":"A","text":"The formula is proved for all sizes"},{"key":"B","text":"The listing must be wrong, since formulas are exact"},{"key":"C","text":"Listing was unnecessary: once a formula exists, enumerating the cases adds no evidence of any kind"},{"key":"D","text":"The formula is right for this case and worth trusting more; other sizes still need a proof"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A brute-force count checks the formula on one case; a counting argument proves it for all.","misconceptions":["Treats one agreeing case as a proof","Trusts the formula over a count made by definition","Discards the check that catches formula errors",""],"lo":["LO5"],"day":5,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w5-pigeonhole","type":"single","prompt":"A system cuts every customer number down to a 2-digit code (100 codes). It has 250 customers. What is certain?","options":[{"key":"A","text":"No code is shared by more than 3 customers"},{"key":"B","text":"Every code is used"},{"key":"C","text":"Some code is shared by at least 3 customers"},{"key":"D","text":"Collisions happen only after 10,000 customers"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"⌈250 / 100⌉ = 3: if each code held at most 2 customers, 100 codes would hold only 200.","misconceptions":["Confuses a lower bound with an upper bound","Assumes an even spread: some codes may be unused","","Squares the number of codes, mixing pigeonhole with the birthday threshold"],"lo":["LO5"],"day":5,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w6-ie-three","type":"single","prompt":"Of 100 staff, 40 speak French, 30 Spanish and 20 German; 10 speak French and Spanish, 8 French and German, 5 Spanish and German, and 3 all three. How many speak at least one?","options":[{"key":"A","text":"90"},{"key":"B","text":"67"},{"key":"C","text":"70"},{"key":"D","text":"64"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"40 + 30 + 20 − 10 − 8 − 5 + 3 = 70.","misconceptions":["Adds the three sets without removing overlaps","Forgets to add back the 3 who speak all three","","Subtracts the triple overlap instead of adding it back"],"lo":["LO5"],"day":6,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w6-combinations","type":"single","prompt":"A register keeps birth year (50 values), sex and one of 20 districts for 1,000 people. How many combinations are possible, and what does that suggest?","options":[{"key":"A","text":"72 combinations: everyone shares with many others"},{"key":"B","text":"2,000 combinations: about half a person per combination, so many people are alone"},{"key":"C","text":"1,000 combinations: exactly one person each"},{"key":"D","text":"100,000 combinations: so many that people spread out and no one can be alone"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"50 · 2 · 20 = 2,000 combinations for 1,000 people: on average half a person each, so many classes hold one person.","misconceptions":["Adds the column sizes instead of multiplying","","Confuses the number of people with the number of combinations","Inflates the product, and draws the opposite conclusion: more combinations means more people alone"],"lo":["LO5"],"day":6,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w6-not-anonymous","type":"single","prompt":"A charity drops the member number from a list but keeps date of birth, sex and postcode district. Why is the list still personal data?","options":[{"key":"A","text":"Because those columns together can indirectly identify most members"},{"key":"B","text":"Because any list about people is personal data"},{"key":"C","text":"Because the member number can be guessed from the row order"},{"key":"D","text":"Because the list was not encrypted"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The Law's definition covers data that may directly or indirectly make identification possible; unique combinations do that.","misconceptions":["","Overstates the rule: aggregated counts with large groups need not identify anyone","Names a possible leak, but not the reason the columns themselves identify people","Confuses protection in transit with whether data identifies people"],"lo":["LO5"],"day":6,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w6-union-risk","type":"single","prompt":"Two tables are released from one register. 40 people are alone in the first, 25 in the second, and 10 of them are alone in both. How many people can be singled out?","options":[{"key":"A","text":"40"},{"key":"B","text":"65"},{"key":"C","text":"25"},{"key":"D","text":"55"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Anyone alone in either table can be found: 40 + 25 − 10 = 55.","misconceptions":["Takes the riskier table alone, ignoring the second","Counts the 10 people twice","Takes the safer table alone",""],"lo":["LO5"],"day":6,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w6-generalise","type":"single","prompt":"Which change to a released table most reduces the number of people who are alone in their combination?","options":[{"key":"A","text":"Sorting the rows into a random order before the table is released"},{"key":"B","text":"Removing the first row"},{"key":"C","text":"Renaming the columns"},{"key":"D","text":"Replacing full birth date by a ten-year band"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Generalising a quasi-identifier merges combinations, so classes grow and fewer people stand alone.","misconceptions":["Thinks row order identifies people: the combinations stay the same","Removes one person, not the risk to the others","Thinks column names matter: the values still single people out",""],"lo":["LO5"],"day":6,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w7-degree-sum","type":"single","prompt":"A build file lists 18 dependencies between 11 modules, each as (needed module, module that needs it). What do the in-degrees of the 11 modules add up to?","options":[{"key":"A","text":"11"},{"key":"B","text":"36"},{"key":"C","text":"18"},{"key":"D","text":"29"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Each dependency arrives at exactly one module, so it adds one to exactly one in-degree: the in-degrees add up to the 18 edges.","misconceptions":["Counts the modules, not the edges","Doubles the edges, as for in-degree plus out-degree together","","Adds modules and edges"],"lo":["LO6"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w7-peel-stops","type":"single","prompt":"A warehouse runs its tasks by repeatedly starting every task whose prerequisites are all done. After a while 7 tasks remain and none can start. What must be true?","options":[{"key":"A","text":"Every one of the 7 tasks is on a cycle"},{"key":"B","text":"The 7 remaining tasks contain a cycle of prerequisites"},{"key":"C","text":"One of the 7 tasks has no prerequisites"},{"key":"D","text":"The prerequisite file has a duplicate line that blocks the tasks listed after it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"If no remaining task can start, each one waits on another remaining task; walking back through finitely many tasks must repeat one, which is a cycle. Tasks downstream of the cycle wait too, so not all 7 need be on it.","misconceptions":["Forgets the tasks downstream of a cycle, which wait without being on it","","Contradicts the situation: such a task could start","A duplicate line repeats an edge and blocks nothing"],"lo":["LO6"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w7-valid-order","type":"single","prompt":"Course modules have prerequisites M1 before M3, M2 before M3, M3 before M5 and M2 before M4. Which study order respects every prerequisite?","options":[{"key":"A","text":"M2, M4, M1, M3, M5"},{"key":"B","text":"M1, M3, M2, M4, M5"},{"key":"C","text":"M3, M1, M2, M4, M5"},{"key":"D","text":"M1, M2, M5, M3, M4"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Check each prerequisite: M1 and M2 come before M3, M3 before M5, and M2 before M4. Only M2, M4, M1, M3, M5 passes all four.","misconceptions":["","Puts M3 before M2, breaking M2 before M3","Starts with M3, before both its prerequisites","Puts M5 before M3, breaking M3 before M5"],"lo":["LO6"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w7-order-check","type":"single","prompt":"A script claims to return a valid running order of 40 jobs. What check proves its output is valid?","options":[{"key":"A","text":"Every job appears exactly once and, for every dependency (u, v), u appears before v"},{"key":"B","text":"The first job has no dependency, the last has nothing depending on it, and no job is missing"},{"key":"C","text":"The order matches the one a graph library returns"},{"key":"D","text":"Every job appears exactly once"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A topological order is defined edge by edge, so checking every edge and that each job appears once is the whole definition.","misconceptions":["","Checks only the two ends: a middle edge can still point backwards","Orders are rarely unique: a valid order can differ from the library's","Checks the jobs and none of the edges"],"lo":["LO6"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w7-paths-recurrence","type":"single","prompt":"In a graph without cycles, node T has three predecessors with 4, 2 and 5 paths into each from the sources. How many paths from the sources reach T?","options":[{"key":"A","text":"40"},{"key":"B","text":"5"},{"key":"C","text":"3"},{"key":"D","text":"11"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Each path into T arrives by exactly one last edge, so the paths split by predecessor: 4 + 2 + 5 = 11.","misconceptions":["Multiplies the counts: that would count choosing one path into each predecessor at once","Takes the largest predecessor count","Counts the predecessors, not the paths",""],"lo":["LO4","LO6"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w7-closed-form","type":"single","prompt":"A count satisfies T(0) = 1 and T(n) = 3 · T(n − 1). Which closed form is right, and what does its proof use?","options":[{"key":"A","text":"T(n) = 3n + 1, proved by checking n = 0 to 5"},{"key":"B","text":"T(n) = n³, by induction on n"},{"key":"C","text":"T(n) = 3ⁿ, by induction: the step uses T(n − 1) = 3ⁿ⁻¹"},{"key":"D","text":"T(n) = 3ⁿ, proved by checking n = 0 to 20"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The values are 1, 3, 9, 27: T(n) = 3ⁿ. Base T(0) = 1 = 3⁰; step T(n) = 3 · 3ⁿ⁻¹ = 3ⁿ uses the hypothesis for n − 1.","misconceptions":["Treats repeated multiplying as adding, and a few checks are not a proof","Confuses 3ⁿ with n³, which gives 0 at n = 0","","Checks cases: tests support the claim but prove it only for those 21 values"],"lo":["LO4"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w7-growth","type":"single","prompt":"Listing every possible order of n independent jobs takes about 1 microsecond per order. Roughly how long for 20 jobs?","options":[{"key":"A","text":"About a second"},{"key":"B","text":"About 77,000 years"},{"key":"C","text":"About 20 microseconds"},{"key":"D","text":"About 400 microseconds"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"20 independent jobs have 20! ≈ 2.4 × 10¹⁸ orders; at 10⁶ per second that is about 2.4 × 10¹² seconds, roughly 77,000 years.","misconceptions":["Thinks the count grows like 2ⁿ, about a million orders","","Thinks the count grows like n","Thinks the count grows like n²"],"lo":["LO4"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"}]}</script>
