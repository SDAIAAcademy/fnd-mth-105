<section>
<h2>Week 1: Sets, functions and relations</h2>
<ol>
<li><p>A training team lists 8 modules and 5 rooms. It wants one row for every module and room that could be booked together. How many rows does that table have?</p><ul><li><b>A.</b> 13</li><li><b>B.</b> 40</li><li><b>C.</b> 2 to the power 40</li><li><b>D.</b> 80</li></ul></li>
<li><p>A sports hall gives each of its 120 lockers to one of 4 cleaning rounds, every round gets 30 lockers. As a map from lockers to rounds, which is true?</p><ul><li><b>A.</b> A bijection, since every round gets the same number</li><li><b>B.</b> Not a function, since each round has many lockers</li><li><b>C.</b> Injective, since every round is used</li><li><b>D.</b> A surjective function that is not injective</li></ul></li>
<li><p>A library joins loans (reader, copy) with copies (copy, title). One reader borrowed two copies of the same title. Compared with the composition "reader borrowed title", the join returns:</p><ul><li><b>A.</b> the same number of rows as there are pairs</li><li><b>B.</b> one fewer row, as the second copy is dropped</li><li><b>C.</b> one more row: the (reader, title) pair appears twice</li><li><b>D.</b> an error, as the key repeats</li></ul></li>
<li><p>A clinic lists 6 doctors and 4 consulting rooms. A rota table has one row for every possible doctor and room pair. How many rows does it have?</p><ul><li><b>A.</b> 24</li><li><b>B.</b> 10</li><li><b>C.</b> 2 to the power 24</li><li><b>D.</b> 4 to the power 6</li></ul></li>
<li><p>A staff table maps each employee code to a desk. Two codes have no desk and one code has two desks. Which statement is right?</p><ul><li><b>A.</b> It is an injective function</li><li><b>B.</b> It is a function, only not surjective</li><li><b>C.</b> It is a bijection once the duplicates are removed</li><li><b>D.</b> It is not a function on the employee codes</li></ul></li>
<li><p>Which map from the integers to the integers is injective but not surjective?</p><ul><li><b>A.</b> n to n squared</li><li><b>B.</b> n to n minus 4</li><li><b>C.</b> n to 5n</li><li><b>D.</b> n to the remainder of n divided by 2</li></ul></li>
<li><p>A warehouse joins orders (customer, order) with order lines (order, product). Is the join the composition 'customer ordered product'?</p><ul><li><b>A.</b> Yes, row for row</li><li><b>B.</b> Its distinct rows are; the join can repeat a pair</li><li><b>C.</b> No, a join is never related to composition</li><li><b>D.</b> Only when every order has exactly one line in the table, never otherwise</li></ul></li>
</ol>
</section>
<section>
<h2>Week 2: Logic: truth tables and satisfiability</h2>
<ol>
<li><p>A school replaces each of its 500 pupil numbers with a random code from 1,000 possible codes, never giving one code twice. As a map from pupils to the 1,000 codes, what is it?</p><ul><li><b>A.</b> A bijection</li><li><b>B.</b> Injective, not surjective</li><li><b>C.</b> Surjective, not injective</li><li><b>D.</b> Not a function</li></ul></li>
<li><p>A warehouse rule: "If a box is fragile, it is packed with foam." Which sentence is equivalent to it?</p><ul><li><b>A.</b> If a box is packed with foam, it is fragile</li><li><b>B.</b> If a box is not fragile, it is not packed with foam</li><li><b>C.</b> Every box is fragile and packed with foam</li><li><b>D.</b> If a box is not packed with foam, it is not fragile</li></ul></li>
<li><p>A laboratory: "A visitor may enter only if they wear goggles." With p = "the visitor enters" and s = "the visitor wears goggles", which formula is the rule?</p><ul><li><b>A.</b> s → p</li><li><b>B.</b> p → s</li><li><b>C.</b> p ∧ s</li><li><b>D.</b> p ↔ s</li></ul></li>
<li><p>A clinic encodes its nurse rota and the solver answers "unsatisfiable". What has been established?</p><ul><li><b>A.</b> The solver failed and should be run again with more time</li><li><b>B.</b> No rota was found among those the solver tried</li><li><b>C.</b> No rota meets all the clauses as written</li><li><b>D.</b> No rota meets the clinic's real rules</li></ul></li>
<li><p>Rule: if a request is urgent, the duty officer is paged. The duty officer was paged. A colleague concludes the request was urgent. Is the argument valid?</p><ul><li><b>A.</b> Valid, by modus ponens</li><li><b>B.</b> Invalid: a non-urgent request may also page the officer</li><li><b>C.</b> Valid, by modus tollens, since the officer was paged and the rule holds</li><li><b>D.</b> Invalid, because the rule itself may be false</li></ul></li>
<li><p>'The gate stays locked unless a guard is present.' With l = locked and g = guard present, which formula is equivalent?</p><ul><li><b>A.</b> l ∨ g</li><li><b>B.</b> g → l</li><li><b>C.</b> l ∧ ¬g</li><li><b>D.</b> l ↔ g</li></ul></li>
<li><p>Six tasks are yes-or-no variables. Encoding 'at most one task runs' by forbidding every pair, how many clauses are needed?</p><ul><li><b>A.</b> 6</li><li><b>B.</b> 12</li><li><b>C.</b> 36</li><li><b>D.</b> 15</li></ul></li>
<li><p>Which pair of formulas is equivalent on every row of the truth table?</p><ul><li><b>A.</b> p → q and q → p</li><li><b>B.</b> ¬(p ∨ q) and ¬p ∨ ¬q</li><li><b>C.</b> p → q and ¬p ∨ q</li><li><b>D.</b> p ∧ (q ∨ r) and (p ∧ q) ∨ r</li></ul></li>
<li><p>A solver returns a shift plan for a clinic. What should the planner do before using it?</p><ul><li><b>A.</b> Nothing: a solver's model always meets the rules</li><li><b>B.</b> Run the solver a second time and compare the two plans it returns, line by line</li><li><b>C.</b> Check the plan against the rules in words with separate code</li><li><b>D.</b> Count the clauses to confirm the encoding is complete</li></ul></li>
</ol>
</section>
<section>
<h2>Week 3: Predicates, quantifiers and first proofs</h2>
<ol>
<li><p>Rule: if a meter reading is missing, the bill is estimated. This bill is not estimated. What follows?</p><ul><li><b>A.</b> The reading is not missing</li><li><b>B.</b> The reading is missing</li><li><b>C.</b> Nothing: the rule says nothing about estimated bills</li><li><b>D.</b> The bill would be estimated if the reading were present</li></ul></li>
<li><p>The claim: "every course has at least one tutor". Which statement is its negation?</p><ul><li><b>A.</b> Every course has no tutor</li><li><b>B.</b> Some course has at least one tutor</li><li><b>C.</b> Some course has no tutor</li><li><b>D.</b> One tutor teaches no course</li></ul></li>
<li><p>A delivery firm relates two depots when they are within 5 km of each other, and wants to form groups of "nearby" depots with it. What is this relation?</p><ul><li><b>A.</b> An equivalence relation, so the groups are well defined</li><li><b>B.</b> Reflexive and symmetric, not transitive, so not an equivalence</li><li><b>C.</b> A partial order on the depots</li><li><b>D.</b> Symmetric only, as no depot relates to itself</li></ul></li>
<li><p>An analyst claims: "for every integer n, n² + n is even". Her code checks n from −1,000 to 1,000 and finds no failure. What has she shown?</p><ul><li><b>A.</b> That the claim is true, since 2,001 cases passed</li><li><b>B.</b> Nothing: tests are no evidence either way</li><li><b>C.</b> That the claim is false for some large n</li><li><b>D.</b> No counterexample in that range; a proof is still needed</li></ul></li>
<li><p>In a sports league, team A relates to team B when A has at least as many points as B. Two teams are level on points. Which kind of relation is it?</p><ul><li><b>A.</b> An equivalence relation</li><li><b>B.</b> A preorder that is not a partial order</li><li><b>C.</b> A partial order, since the relation is reflexive and transitive</li><li><b>D.</b> A strict order</li></ul></li>
<li><p>Which relation on the people of a town is NOT transitive?</p><ul><li><b>A.</b> Lives within 2 km of</li><li><b>B.</b> Is older than</li><li><b>C.</b> Was born in the same year as</li><li><b>D.</b> Has the same surname initial as</li></ul></li>
<li><p>Rule: 'every invoice has an approver'. Which finding shows the rule is broken?</p><ul><li><b>A.</b> One invoice has two approvers</li><li><b>B.</b> Every invoice has no approver</li><li><b>C.</b> One approver has no invoice</li><li><b>D.</b> One invoice has no approver</li></ul></li>
<li><p>A colleague claims: 'for every positive integer n, 2n + 1 is prime'. Which is the best response?</p><ul><li><b>A.</b> Test n from 1 to 3: all prime, so accept</li><li><b>B.</b> Reject it, because claims about all integers cannot be checked</li><li><b>C.</b> Ask for a proof by induction before deciding</li><li><b>D.</b> Give n = 4: 2n + 1 = 9 = 3 · 3</li></ul></li>
<li><p>To prove 'if n² is odd then n is odd' by contradiction, what do you assume first?</p><ul><li><b>A.</b> n² is odd and n is odd</li><li><b>B.</b> n² is even and n is even</li><li><b>C.</b> n² is odd and n is even</li><li><b>D.</b> n is odd</li></ul></li>
</ol>
</section>
<section>
<h2>Week 4: Induction, invariants and the limits of testing</h2>
<ol>
<li><p>On the files of a shared drive, "file A is in the same folder as file B or in one of its subfolders" relates A to B. Which property does it lack?</p><ul><li><b>A.</b> Reflexivity</li><li><b>B.</b> Transitivity</li><li><b>C.</b> It has all four, so it is an equivalence</li><li><b>D.</b> Symmetry</li></ul></li>
<li><p>A proof that "n + 1 &lt; n for every n ≥ 1" assumes k + 1 &lt; k and adds 1 to both sides to get k + 2 &lt; k + 1. What is wrong with it?</p><ul><li><b>A.</b> It has no base case, and the base case is false</li><li><b>B.</b> Adding 1 to both sides is not allowed</li><li><b>C.</b> The hypothesis assumes what it wants to prove</li><li><b>D.</b> It needs strong induction instead</li></ul></li>
<li><p>To prove by structural induction that a recursive depth function on nested lists is correct, the step for a list [a, b, c] may assume:</p><ul><li><b>A.</b> that the function is correct on [a, b, c]</li><li><b>B.</b> that it is correct on a only</li><li><b>C.</b> that it is correct on each of a, b and c</li><li><b>D.</b> that it is correct on every list of length 2</li></ul></li>
<li><p>A loop counts the even numbers in a list: count starts at 0, i at 0; each pass adds 1 to count if xs[i] is even, then adds 1 to i. Which invariant proves it correct?</p><ul><li><b>A.</b> count ≥ 0</li><li><b>B.</b> count equals the number of evens in the whole list</li><li><b>C.</b> count = i</li><li><b>D.</b> count equals the number of evens in xs[:i]</li></ul></li>
<li><p>In an induction proof that 3 divides n³ − n for every n ≥ 1, where must the hypothesis be used?</p><ul><li><b>A.</b> In the base case, to check n = 1</li><li><b>B.</b> In the step, to rewrite the part of (k + 1)³ − (k + 1) that equals k³ − k</li><li><b>C.</b> At the end, to conclude the claim for all n</li><li><b>D.</b> Nowhere: the step is pure algebra on (k + 1)³ − (k + 1), expanded and regrouped term by term</li></ul></li>
<li><p>A claim about every positive integer passes all tests for n up to 10,000. What may the report say?</p><ul><li><b>A.</b> No counterexample for n from 1 to 10,000; not yet proved</li><li><b>B.</b> The claim is true for all practical purposes</li><li><b>C.</b> The claim is true</li><li><b>D.</b> The claim is false beyond 10,000</li></ul></li>
<li><p>An analyst shows that an invariant holds before a loop and after every pass. What else does the correctness proof need?</p><ul><li><b>A.</b> That the loop terminates, and that the invariant with the exit condition gives the result</li><li><b>B.</b> Nothing more</li><li><b>C.</b> A test on random inputs</li><li><b>D.</b> That the invariant also holds in the middle of every pass, between any two statements of the loop body</li></ul></li>
<li><p>A proof that '2ⁿ ≥ n³ for every n ≥ 1' checks n = 1 and has a step that uses 2k³ ≥ (k + 1)³ without saying so. Testing shows 2² = 4 &lt; 8 = 2³. Where is the gap?</p><ul><li><b>A.</b> In the base case</li><li><b>B.</b> Nowhere: a written proof outweighs a failing test, so the test must be wrong</li><li><b>C.</b> In the identity 2ᵏ⁺¹ = 2 · 2ᵏ</li><li><b>D.</b> In the step, which is not valid for small k</li></ul></li>
<li><p>A recursive function counts the files in a folder tree by adding the counts of its subfolders. A proof of its correctness by structural induction assumes:</p><ul><li><b>A.</b> the function is correct on the whole tree</li><li><b>B.</b> the tree has at most two levels</li><li><b>C.</b> the function is correct on every subfolder of the folder</li><li><b>D.</b> every folder has the same number of files</li></ul></li>
</ol>
</section>
<section>
<h2>Week 5: Counting, collisions and the birthday problem</h2>
<ol>
<li><p>To prove 1 + 3 + 9 + … + 3ⁿ⁻¹ = (3ⁿ − 1) / 2 by induction, the step for k + 1 must:</p><ul><li><b>A.</b> check the formula for n = k + 1 by computing both sides for k = 5</li><li><b>B.</b> assume the formula for k + 1 and simplify</li><li><b>C.</b> replace the first k terms by (3ᵏ − 1) / 2, add 3ᵏ, and simplify to (3ᵏ⁺¹ − 1) / 2</li><li><b>D.</b> test the formula for n up to 1,000</li></ul></li>
<li><p>A tasting panel of 4 judges is chosen from 9 cooks; the judges have no roles. How many panels are possible?</p><ul><li><b>A.</b> 3,024</li><li><b>B.</b> 126</li><li><b>C.</b> 6,561</li><li><b>D.</b> 36</li></ul></li>
<li><p>A shop gives each of 50 loyalty cards a random 3-digit code (1,000 codes). On average over all assignments, how many pairs of cards share a code?</p><ul><li><b>A.</b> 0.05</li><li><b>B.</b> 2.45</li><li><b>C.</b> 50</li><li><b>D.</b> 1.225</li></ul></li>
<li><p>A depot sorts 830 parcels into 100 bays by the last two digits of the parcel number. What does the pigeonhole principle guarantee?</p><ul><li><b>A.</b> Some bay receives at least 9 parcels</li><li><b>B.</b> Every bay receives 8 or 9 parcels</li><li><b>C.</b> Some bay receives at least 8 parcels, and no more is guaranteed</li><li><b>D.</b> Nothing, since 830 is less than 100 · 100</li></ul></li>
<li><p>A ticket code is one letter from A to J followed by three digits. How many codes are there?</p><ul><li><b>A.</b> 13</li><li><b>B.</b> 10,000</li><li><b>C.</b> 1,000</li><li><b>D.</b> 40</li></ul></li>
<li><p>From 7 drivers, a dispatcher picks a first, a second and a third driver for a route, in that order. How many choices are there?</p><ul><li><b>A.</b> 35</li><li><b>B.</b> 210</li><li><b>C.</b> 343</li><li><b>D.</b> 21</li></ul></li>
<li><p>Four guests each get one of 10 table numbers at random. Counting assignments, what is the chance that all four numbers differ?</p><ul><li><b>A.</b> 10 · 9 · 8 · 7 / 10⁴</li><li><b>B.</b> 4 / 10</li><li><b>C.</b> 1 − 4/10</li><li><b>D.</b> C(10, 4) / 10⁴</li></ul></li>
<li><p>An analyst's formula for collision-free assignments gives 60 for 5 codes and 3 people. Listing all 125 assignments finds 60 with no repeat. What does the agreement show?</p><ul><li><b>A.</b> The formula is proved for all sizes</li><li><b>B.</b> The listing must be wrong, since formulas are exact</li><li><b>C.</b> Listing was unnecessary: once a formula exists, enumerating the cases adds no evidence of any kind</li><li><b>D.</b> The formula is right for this case and worth trusting more; other sizes still need a proof</li></ul></li>
<li><p>A system cuts every customer number down to a 2-digit code (100 codes). It has 250 customers. What is certain?</p><ul><li><b>A.</b> No code is shared by more than 3 customers</li><li><b>B.</b> Every code is used</li><li><b>C.</b> Some code is shared by at least 3 customers</li><li><b>D.</b> Collisions happen only after 10,000 customers</li></ul></li>
</ol>
</section>
<section>
<h2>Week 6: Counting people: re-identification risk</h2>
<ol>
<li><p>Five interns each draw one of 8 desk numbers. In how many of the 8⁵ draws do all five get different desks?</p><ul><li><b>A.</b> 56</li><li><b>B.</b> 32,768</li><li><b>C.</b> 6,720</li><li><b>D.</b> 40,320</li></ul></li>
<li><p>Of a club's members, 45 read the newsletter, 30 attend events and 12 do both. How many do at least one of the two?</p><ul><li><b>A.</b> 75</li><li><b>B.</b> 63</li><li><b>C.</b> 51</li><li><b>D.</b> 33</li></ul></li>
<li><p>A survey of 500 people keeps age in years (60 values), sex and one of 4 regions. Roughly how many combinations are there per person?</p><ul><li><b>A.</b> 240,000</li><li><b>B.</b> 66</li><li><b>C.</b> about 0.48</li><li><b>D.</b> about 0.96</li></ul></li>
<li><p>A gym removes member numbers from its list and keeps full birth date, sex and home district. Most members are alone in their combination. Under the Law's definition, the list is:</p><ul><li><b>A.</b> anonymised, since no identifier remains</li><li><b>B.</b> still personal data, since it makes identification indirectly possible</li><li><b>C.</b> pseudonymised, so outside the Law</li><li><b>D.</b> personal data only if more than half are unique</li></ul></li>
<li><p>Of 100 staff, 40 speak French, 30 Spanish and 20 German; 10 speak French and Spanish, 8 French and German, 5 Spanish and German, and 3 all three. How many speak at least one?</p><ul><li><b>A.</b> 90</li><li><b>B.</b> 67</li><li><b>C.</b> 70</li><li><b>D.</b> 64</li></ul></li>
<li><p>A register keeps birth year (50 values), sex and one of 20 districts for 1,000 people. How many combinations are possible, and what does that suggest?</p><ul><li><b>A.</b> 72 combinations: everyone shares with many others</li><li><b>B.</b> 2,000 combinations: about half a person per combination, so many people are alone</li><li><b>C.</b> 1,000 combinations: exactly one person each</li><li><b>D.</b> 100,000 combinations: so many that people spread out and no one can be alone</li></ul></li>
<li><p>A charity drops the member number from a list but keeps date of birth, sex and postcode district. Why is the list still personal data?</p><ul><li><b>A.</b> Because those columns together can indirectly identify most members</li><li><b>B.</b> Because any list about people is personal data</li><li><b>C.</b> Because the member number can be guessed from the row order</li><li><b>D.</b> Because the list was not encrypted</li></ul></li>
<li><p>Two tables are released from one register. 40 people are alone in the first, 25 in the second, and 10 of them are alone in both. How many people can be singled out?</p><ul><li><b>A.</b> 40</li><li><b>B.</b> 65</li><li><b>C.</b> 25</li><li><b>D.</b> 55</li></ul></li>
<li><p>Which change to a released table most reduces the number of people who are alone in their combination?</p><ul><li><b>A.</b> Sorting the rows into a random order before the table is released</li><li><b>B.</b> Removing the first row</li><li><b>C.</b> Renaming the columns</li><li><b>D.</b> Replacing full birth date by a ten-year band</li></ul></li>
</ol>
</section>
<section>
<h2>Week 7: Graphs, topological order and growth</h2>
<ol>
<li><p>Two tables are released. 32 people are alone in their combination in the first, 18 in the second, and 7 of them are alone in both. How many people are alone in at least one table?</p><ul><li><b>A.</b> 43</li><li><b>B.</b> 50</li><li><b>C.</b> 32</li><li><b>D.</b> 36</li></ul></li>
<li><p>Edges: A → B, B → C, C → D, D → B, A → E. Peeling starts with every job that has no dependency. Which jobs are never ready?</p><ul><li><b>A.</b> B, C and D</li><li><b>B.</b> D only</li><li><b>C.</b> B, C, D and E</li><li><b>D.</b> none, since A has no dependency</li></ul></li>
<li><p>Edges: P → R, Q → R, R → S, Q → S. Which running order respects every edge?</p><ul><li><b>A.</b> P R Q S</li><li><b>B.</b> Q P S R</li><li><b>C.</b> Q P R S</li><li><b>D.</b> R Q P S</li></ul></li>
<li><p>H(1) = 0 and H(n) = H(n − 1) + (n − 1). What is H(6)?</p><ul><li><b>A.</b> 21</li><li><b>B.</b> 30</li><li><b>C.</b> 36</li><li><b>D.</b> 15</li></ul></li>
<li><p>A build file lists 18 dependencies between 11 modules, each as (needed module, module that needs it). What do the in-degrees of the 11 modules add up to?</p><ul><li><b>A.</b> 11</li><li><b>B.</b> 36</li><li><b>C.</b> 18</li><li><b>D.</b> 29</li></ul></li>
<li><p>A warehouse runs its tasks by repeatedly starting every task whose prerequisites are all done. After a while 7 tasks remain and none can start. What must be true?</p><ul><li><b>A.</b> Every one of the 7 tasks is on a cycle</li><li><b>B.</b> The 7 remaining tasks contain a cycle of prerequisites</li><li><b>C.</b> One of the 7 tasks has no prerequisites</li><li><b>D.</b> The prerequisite file has a duplicate line that blocks the tasks listed after it</li></ul></li>
<li><p>Course modules have prerequisites M1 before M3, M2 before M3, M3 before M5 and M2 before M4. Which study order respects every prerequisite?</p><ul><li><b>A.</b> M2, M4, M1, M3, M5</li><li><b>B.</b> M1, M3, M2, M4, M5</li><li><b>C.</b> M3, M1, M2, M4, M5</li><li><b>D.</b> M1, M2, M5, M3, M4</li></ul></li>
<li><p>A script claims to return a valid running order of 40 jobs. What check proves its output is valid?</p><ul><li><b>A.</b> Every job appears exactly once and, for every dependency (u, v), u appears before v</li><li><b>B.</b> The first job has no dependency, the last has nothing depending on it, and no job is missing</li><li><b>C.</b> The order matches the one a graph library returns</li><li><b>D.</b> Every job appears exactly once</li></ul></li>
<li><p>In a graph without cycles, node T has three predecessors with 4, 2 and 5 paths into each from the sources. How many paths from the sources reach T?</p><ul><li><b>A.</b> 40</li><li><b>B.</b> 5</li><li><b>C.</b> 3</li><li><b>D.</b> 11</li></ul></li>
<li><p>A count satisfies T(0) = 1 and T(n) = 3 · T(n − 1). Which closed form is right, and what does its proof use?</p><ul><li><b>A.</b> T(n) = 3n + 1, proved by checking n = 0 to 5</li><li><b>B.</b> T(n) = n³, by induction on n</li><li><b>C.</b> T(n) = 3ⁿ, by induction: the step uses T(n − 1) = 3ⁿ⁻¹</li><li><b>D.</b> T(n) = 3ⁿ, proved by checking n = 0 to 20</li></ul></li>
<li><p>Listing every possible order of n independent jobs takes about 1 microsecond per order. Roughly how long for 20 jobs?</p><ul><li><b>A.</b> About a second</li><li><b>B.</b> About 77,000 years</li><li><b>C.</b> About 20 microseconds</li><li><b>D.</b> About 400 microseconds</li></ul></li>
</ol>
</section>
